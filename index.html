<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flare development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0b;
  --bg2: #111113;
  --surface: #161618;
  --border: #2a2a2e;
  --text: #f4f4f5;
  --muted: #a1a1aa;
  --muted2: #71717a;
  --accent: #ff6a1a;
  --accent-hover: #ff7d38;
  --green: #22c55e;
  --red: #ef4444;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  scroll-behavior: smooth;
}
body {
  min-height: 100vh;
  color: var(--text);
  background: var(--bg);
  font-family: Inter, system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button,
input {
  font: inherit;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}

.app {
  min-height: 100vh;
  display: flex;
}

.side {
  width: 38.2%;
  max-width: 380px;
  min-width: 260px;
  min-height: 100vh;
  position: sticky;
  top: 0;
  display: flex;
  flex-direction: column;
  padding: 24px 18px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.3px;
}
.brand-logo {
  width: 26px;
  height: 26px;
  object-fit: cover;
}

.sidebar-section {
  margin-bottom: 20px;
}

.label {
  color: var(--muted2);
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.input-row {
  display: flex;
  gap: 8px;
}
.input-row input {
  width: 100%;
  height: 40px;
  padding: 0 12px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  outline: none;
}
.input-row input::placeholder {
  color: var(--muted2);
}
.input-row input:focus {
  border-color: var(--accent);
}
.input-row button {
  flex: 0 0 40px;
  height: 40px;
  border: 0;
  color: #fff;
  background: var(--accent);
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
}
.input-row button:hover {
  background: var(--accent-hover);
}

.shops {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.shops label {
  flex: 1;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
.shops label:hover {
  color: var(--text);
}
.shops input {
  accent-color: var(--accent);
}

.item-list {
  flex: 1;
  min-height: 80px;
  overflow-y: auto;
  margin-bottom: 16px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.item-list::-webkit-scrollbar {
  width: 4px;
}
.item-list::-webkit-scrollbar-thumb {
  background: var(--border);
}

.item-tag {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 38px;
  padding: 8px 10px 8px 12px;
  margin-bottom: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 13px;
  font-weight: 500;
}
.item-tag span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.remove {
  flex: 0 0 22px;
  width: 22px;
  height: 22px;
  border: 0;
  color: var(--muted2);
  background: transparent;
  font-size: 15px;
  cursor: pointer;
}
.remove:hover {
  color: var(--text);
  background: rgba(239, 68, 68, 0.12);
}

.empty-list {
  padding: 14px 0;
  color: var(--muted2);
  font-size: 12px;
}

.search-btn {
  width: 100%;
  height: 42px;
  border: 0;
  color: #fff;
  background: var(--accent);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.search-btn:hover {
  background: var(--accent-hover);
}

.main {
  flex: 1;
  min-width: 0;
  padding: 40px clamp(24px, 4vw, 56px) 56px;
}

.content {
  width: 100%;
  max-width: 860px;
}

.header {
  margin-bottom: 28px;
}
.header h1 {
  margin-bottom: 8px;
  font-size: clamp(28px, 3.5vw, 36px);
  font-weight: 600;
  letter-spacing: -0.8px;
  line-height: 1.15;
}
.header p {
  max-width: 520px;
  color: var(--muted);
  font-size: 15px;
}

.total-card {
  padding: 20px;
  margin-bottom: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
}
.total-top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}
.total-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
}
.total-label strong {
  display: block;
  color: var(--text);
  margin-top: 2px;
  font-size: 14px;
  font-weight: 600;
}
.total-price {
  color: var(--green);
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.5px;
}

.cheapest-links {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 8px;
}
.cheap-link {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 12px;
  color: var(--text);
  text-decoration: none;
  background: var(--bg2);
  border: 1px solid var(--border);
}
.cheap-link:hover {
  border-color: var(--accent);
}
.cheap-link .left {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.cheap-link .term {
  color: var(--muted2);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.cheap-link .name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 500;
}
.cheap-link .price {
  color: var(--green);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}

.results-grid {
  display: grid;
  gap: 12px;
}

.item-card {
  background: var(--surface);
  border: 1px solid var(--border);
}
.item-card-header {
  min-height: 46px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
.product-name {
  font-size: 13px;
  font-weight: 600;
}
.from {
  color: var(--muted2);
  font-size: 11px;
  font-weight: 500;
}
.from b {
  color: var(--green);
  font-size: 13px;
}

.product {
  position: relative;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.product:last-child {
  border-bottom: 0;
}
.product.best {
  background: rgba(34, 197, 94, 0.04);
}
.product.best::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--green);
}

.product-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.price {
  color: var(--green);
  font-size: 18px;
  font-weight: 600;
}
.product:not(.best) .price {
  font-size: 14px;
}
.best-badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 7px;
  color: var(--green);
  background: rgba(34, 197, 94, 0.1);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.title {
  margin: 4px 0 8px;
  color: #e4e4e7;
  font-size: 13px;
  line-height: 1.45;
}
.meta {
  display: flex;
  align-items: center;
  gap: 8px;
}
.store {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  padding: 2px 8px;
  color: var(--muted);
  background: var(--bg2);
  border: 1px solid var(--border);
  font-size: 10px;
  font-weight: 500;
}
.open {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-left: auto;
  color: var(--accent);
  text-decoration: none;
  font-size: 12px;
  font-weight: 500;
}
.open:hover {
  color: var(--accent-hover);
}

.empty {
  min-height: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 6px;
  padding: 40px;
  color: var(--muted);
  text-align: center;
  background: var(--surface);
  border: 1px solid var(--border);
}
.empty strong {
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
}
.empty span {
  color: var(--muted2);
  font-size: 13px;
}

.error-box {
  padding: 14px 16px;
  margin-bottom: 16px;
  color: #fca5a5;
  background: rgba(239, 68, 68, 0.08);
  border: 1px solid rgba(239, 68, 68, 0.2);
  font-size: 13px;
  line-height: 1.5;
}


#loading {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  background: rgba(10, 10, 11, 0.92);
}
#loading.show {
  display: flex;
}
.loading-logo-wrap {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
}
.loading-logo {
  width: 40px;
  height: 40px;
  object-fit: cover;
}
.loading-copy {
  text-align: center;
}
.loading-copy h2 {
  margin-bottom: 4px;
  font-size: 16px;
  font-weight: 600;
}
.loading-copy p {
  color: var(--muted);
  font-size: 13px;
}
.loading-dots {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin-top: 12px;
}
.loading-dots span {
  width: 5px;
  height: 5px;
  background: var(--accent);
  animation: dot 1.1s ease-in-out infinite;
}
.loading-dots span:nth-child(2) {
  animation-delay: 0.15s;
}
.loading-dots span:nth-child(3) {
  animation-delay: 0.3s;
}
.loading-bar {
  width: min(180px, 50vw);
  height: 2px;
  overflow: hidden;
  background: var(--border);
}
.loading-bar::before {
  content: "";
  display: block;
  width: 40%;
  height: 100%;
  background: var(--accent);
  animation: loadingBar 1.1s ease-in-out infinite;
}

@keyframes dot {
  0%, 80%, 100% { opacity: 0.3; }
  40% { opacity: 1; }
}
@keyframes loadingBar {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(320%); }
}

@media (max-width: 900px) {
  .side {
    width: 300px;
    max-width: none;
  }
}

@media (max-width: 720px) {
  .app {
    display: block;
  }
  .side {
    width: 100%;
    max-width: none;
    min-width: 0;
    min-height: auto;
    position: relative;
    padding: 16px;
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    margin-bottom: 16px;
  }
  .item-list {
    max-height: 160px;
  }
  .main {
    padding: 28px 16px 40px;
  }
  .total-top {
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }
  .total-price {
    font-size: 24px;
  }
  .cheapest-links {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">
    <img
      class="brand-logo"
      src="https://iili.io/fuZmZP9.gif"
      alt="Flare"
    >
    <span>Flare</span>
  </div>
  <div class="sidebar-section">
    <div class="label">Item adder</div>
    <form id="addForm">
      <div class="input-row">
        <input
          type="text"
          id="addInput"
          placeholder="Search box here..."
          autocomplete="off"
          autofocus
        >
        <button type="submit" aria-label="Add item">
          +
        </button>
      </div>
      <div class="shops">
        <label>
          <input type="checkbox" id="amazonToggle" checked>
          Amazon
        </label>
        <label>
          <input type="checkbox" id="tescoToggle" checked>
          Tesco
        </label>
      </div>
    </form>
  </div>
  <div class="label">Added Items</div>
  <div class="item-list" id="itemList"></div>
  <button
    class="search-btn"
    id="searchButton"
    type="button"
    style="display:none;"
  >
    Search prices
  </button>
</aside>
<main class="main">
  <div id="loading">
    <div class="loading-logo-wrap">
      <img
        class="loading-logo"
        src="https://iili.io/fuZmZP9.gif"
        alt="FLARE"
      >
    </div>
    <div class="loading-copy">
      <h2>FLARE is searching</h2>
      <p>
        Finding the best prices across your selected stores
      </p>
      <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <div class="loading-bar"></div>
  </div>
  <div class="content">
    <div class="header">
      <h1>Flare deals.</h1>
      <p>
        Looking for cheap priced deals?
      </p>
    </div>
    <div id="errorArea"></div>
    <div id="contentArea">
      <div class="empty">
        <strong>Whoops... We're empty!</strong>
        <span>
          Add an item to start searching.
        </span>
      </div>
    </div>
  </div>
</main>
</div>
<script>
const FLARE_API =
  "https://d73b-2a00-23c8-3639-601-dd36-aa07-de7d-6164.ngrok-free.app";
const API_SEARCH_PATH = "/api/search";
const LOGO_URL =
  "https://iili.io/fuZmZP9.gif";
let items = [];
let lastResults = null;
const addForm =
  document.getElementById("addForm");
const addInput =
  document.getElementById("addInput");
const itemList =
  document.getElementById("itemList");
const searchButton =
  document.getElementById("searchButton");
const amazonToggle =
  document.getElementById("amazonToggle");
const tescoToggle =
  document.getElementById("tescoToggle");
const loading =
  document.getElementById("loading");
const contentArea =
  document.getElementById("contentArea");
const errorArea =
  document.getElementById("errorArea");
function escapeHTML(value) {
  const div =
    document.createElement("div");
  div.textContent =
    value ?? "";
  return div.innerHTML;
}
function formatPrice(value) {
  const number =
    Number(value);
  if (!Number.isFinite(number)) {
    return "£0.00";
  }
  return "£" +
    number.toFixed(2);
}
function saveItems() {
  localStorage.setItem(
    "flare_items",
    JSON.stringify(items)
  );
}
function loadItems() {
  try {
    const saved =
      JSON.parse(
        localStorage.getItem(
          "flare_items"
        ) || "[]"
      );
    if (Array.isArray(saved)) {
      items =
        saved.filter(
          item =>
            typeof item === "string" &&
            item.trim()
        );
    }
  } catch {
    items = [];
  }
}
function renderItems() {
  if (!items.length) {
    itemList.innerHTML = `
      <div class="empty-list">
        Add products to begin searching for deals.
      </div>
    `;
    searchButton.style.display =
      "none";
    return;
  }
  itemList.innerHTML = "";
  items.forEach(
    (item, index) => {
      const row =
        document.createElement("div");
      row.className =
        "item-tag";
      row.innerHTML = `
        <span>
          ${escapeHTML(item)}
        </span>
        <button
          class="remove"
          type="button"
          aria-label="Remove ${escapeHTML(item)}"
          title="Remove"
          data-index="${index}"
        >
          ×
        </button>
      `;
      row
        .querySelector(".remove")
        .addEventListener(
          "click",
          () => removeItem(index)
        );
      itemList.appendChild(row);
    }
  );
  searchButton.style.display =
    "block";
}
function addItem(value) {
  const item =
    value.trim();
  if (!item) {
    return;
  }
  const exists =
    items.some(
      existing =>
        existing.toLowerCase() ===
        item.toLowerCase()
    );
  if (exists) {
    addInput.value = "";
    return;
  }
  items.push(item);
  saveItems();
  renderItems();
  addInput.value = "";
  addInput.focus();
}
function removeItem(index) {
  items.splice(index, 1);
  saveItems();
  renderItems();
  if (!items.length) {
    lastResults = null;
    showEmptyState();
  }
}
function showLoading() {
  loading.classList.add("show");
  document.body.style.overflow =
    "hidden";
}
function hideLoading() {
  loading.classList.remove("show");
  document.body.style.overflow =
    "";
}
function showError(message) {
  errorArea.innerHTML = `
    <div class="error-box">
      ${escapeHTML(message)}
    </div>
  `;
}
function clearError() {
  errorArea.innerHTML = "";
}
function showEmptyState() {
  contentArea.innerHTML = `
    <div class="empty">
      <strong>
        Whoops... We're empty!
      </strong>
      <span>
        Add an item to start searching.
      </span>
    </div>
  `;
}
function showReadyState() {
  contentArea.innerHTML = `
    <div class="empty">
      <strong>
        Whoops... Nothing seems to be here
        add something new!
      </strong>
      <span>
        Add items and click search to look for deals.
      </span>
    </div>
  `;
}
function createCheapLink(term, data) {
  if (!data || !data.cheapest) {
    return "";
  }
  const product =
    data.cheapest;
  const title =
    String(product.title || "");
  return `
    <a
      class="cheap-link"
      href="${escapeHTML(product.url || "#")}"
      target="_blank"
      rel="noopener noreferrer"
    >
      <div class="left">
        <span class="term">
          ${escapeHTML(term)}
        </span>
        <span class="name">
          ${
            escapeHTML(
              title.length > 70
                ? title.slice(0, 70) + "…"
                : title
            )
          }
        </span>
      </div>
      <span class="price">
        ${formatPrice(product.price)}
      </span>
    </a>
  `;
}
function createProduct(product, best) {
  return `
    <div class="product ${best ? "best" : ""}">
      <div class="product-top">
        <div class="price">
          ${formatPrice(product.price)}
        </div>
        ${
          best
            ? `
              <span class="best-badge">
                Best price
              </span>
            `
            : ""
        }
      </div>
      <div class="title">
        ${escapeHTML(product.title || "Product")}
      </div>
      <div class="meta">
        <span class="store">
          ${escapeHTML(product.store || "Store")}
        </span>
        <a
          class="open"
          href="${escapeHTML(product.url || "#")}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${best ? "Open product →" : "Open →"}
        </a>
      </div>
    </div>
  `;
}
function createItemCard(term, data) {
  const cheapest =
    data && data.cheapest;
  const results =
    data &&
    Array.isArray(data.results)
      ? data.results
      : [];
  let productsHTML = "";
  if (cheapest) {
    productsHTML +=
      createProduct(
        cheapest,
        true
      );
    results
      .filter(
        product =>
          product &&
          product !== cheapest
      )
      .slice(0, 4)
      .forEach(
        product => {
          productsHTML +=
            createProduct(
              product,
              false
            );
        }
      );
  } else {
    productsHTML = `
      <div class="product">
        <div
          class="title"
          style="color:var(--muted);margin:0;"
        >
          No results found for this item.
        </div>
      </div>
    `;
  }
  return `
    <div class="item-card">
      <div class="item-card-header">
        <div class="product-name">
          ${escapeHTML(term)}
        </div>
        ${
          cheapest
            ? `
              <span class="from">
                From
                <b>
                  ${formatPrice(cheapest.price)}
                </b>
              </span>
            `
            : ""
        }
      </div>
      ${productsHTML}
    </div>
  `;
}
function renderResults(data) {
  const results =
    data &&
    data.results &&
    typeof data.results === "object"
      ? data.results
      : {};
  let cheapestLinks = "";
  Object.keys(results)
    .forEach(term => {
      cheapestLinks +=
        createCheapLink(
          term,
          results[term]
        );
    });
  let cards = "";
  Object.keys(results)
    .forEach(term => {
      cards +=
        createItemCard(
          term,
          results[term]
        );
    });
  contentArea.innerHTML = `
    <div class="total-card">
      <div class="total-top">
        <div class="total-label">
          Estimated cheapest total
          <strong>
            Best available prices across your list
          </strong>
        </div>
        <div class="total-price">
          ${formatPrice(data.grand_total || 0)}
        </div>
      </div>
      ${
        cheapestLinks
          ? `
            <div class="cheapest-links">
              ${cheapestLinks}
            </div>
          `
          : ""
      }
    </div>
    <div class="results-grid">
      ${cards}
    </div>
  `;
}
async function searchPrices() {
  if (!items.length) {
    showEmptyState();
    return;
  }
  const amazon =
    amazonToggle.checked;
  const tesco =
    tescoToggle.checked;
  if (!amazon && !tesco) {
    showError(
      "Select at least one store."
    );
    return;
  }
  clearError();
  showLoading();
  try {
    const params =
      new URLSearchParams();
    items.forEach(item => {
      params.append(
        "item",
        item
      );
    });
    params.set(
      "amazon",
      amazon ? "1" : "0"
    );
    params.set(
      "tesco",
      tesco ? "1" : "0"
    );
    const apiUrl =
      `${FLARE_API}${API_SEARCH_PATH}?${params.toString()}`;
    console.log(
      "[FLARE] Request:",
      apiUrl
    );
    const response =
      await fetch(
        apiUrl,
        {
          method: "GET",
          headers: {
            "Accept": "application/json",
            "ngrok-skip-browser-warning": "true"
          },
          credentials: "omit"
        }
      );
    console.log(
      "[FLARE] HTTP status:",
      response.status
    );
    const contentType =
      response.headers.get(
        "content-type"
      ) || "";
    console.log(
      "[FLARE] Content-Type:",
      contentType
    );
    const raw =
      await response.text();
    console.log(
      "[FLARE] Raw response:",
      raw.slice(0, 500)
    );
    if (!response.ok) {
      throw new Error(
        `API returned HTTP ${response.status}. ` +
        `${raw.slice(0, 250)}`
      );
    }
    if (
      !contentType.includes(
        "application/json"
      )
    ) {
      const looksLikeHTML =
        raw.trim().startsWith("<!DOCTYPE") ||
        raw.trim().startsWith("<html") ||
        raw.includes("<html");
      if (looksLikeHTML) {
        throw new Error(
          "The API URL returned the Flare HTML page instead of JSON. " +
          "Your ngrok tunnel is pointing to the frontend instead of backend port 2034."
        );
      }
      throw new Error(
        "The FLARE API did not return JSON. " +
        `Content-Type: ${contentType || "unknown"}`
      );
    }
    let data;
    try {
      data =
        JSON.parse(raw);
    } catch {
      throw new Error(
        "FLARE returned invalid JSON."
      );
    }
    console.log(
      "[FLARE] Parsed response:",
      data
    );
    if (
      !data ||
      data.success !== true
    ) {
      throw new Error(
        data?.error ||
        "The FLARE API returned an unsuccessful response."
      );
    }
    lastResults =
      data;
    renderResults(data);
  } catch (error) {
    console.error(
      "[FLARE] SEARCH ERROR:",
      error
    );
    let message =
      error?.message ||
      "Unable to connect to FLARE.";
    if (
      message === "Failed to fetch" ||
      message.includes(
        "NetworkError"
      )
    ) {
      message =
        "Could not reach the FLARE backend. " +
        "Make sure the backend is running on port 2034, " +
        "ngrok is forwarding to port 2034, and CORS allows this frontend.";
    }
    showError(message);
    showReadyState();
  } finally {
    hideLoading();
  }
}
addForm.addEventListener(
  "submit",
  event => {
    event.preventDefault();
    addItem(
      addInput.value
    );
  }
);
addInput.addEventListener(
  "keydown",
  event => {
    if (
      event.key === "Enter"
    ) {
      event.preventDefault();
      addItem(
        addInput.value
      );
    }
  }
);
searchButton.addEventListener(
  "click",
  searchPrices
);
amazonToggle.addEventListener(
  "change",
  () => {
    if (lastResults) {
      lastResults = null;
      showReadyState();
    }
  }
);
tescoToggle.addEventListener(
  "change",
  () => {
    if (lastResults) {
      lastResults = null;
      showReadyState();
    }
  }
);
loadItems();
renderItems();
if (items.length) {
  showReadyState();
}
</script>
</body>
</html>
