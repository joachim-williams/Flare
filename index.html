<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flare development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070708;
  --bg2: #0b0b0e;
  --panel: rgba(17,17,21,.78);
  --panel2: rgba(255,255,255,.035);
  --line: rgba(255,255,255,.08);
  --line2: rgba(255,255,255,.14);
  --text: #fafafa;
  --muted: #96969f;
  --muted2: #66666f;
  --orange: #ff6a1a;
  --orange2: #ff9a5b;
  --green: #35d778;
  --red: #ff5c69;
  --radius: 20px;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  scroll-behavior: smooth;
}
body {
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(circle at 80% 0%, rgba(255,106,26,.1), transparent 28%),
    radial-gradient(circle at 0% 80%, rgba(255,106,26,.04), transparent 30%),
    var(--bg);
  font-family: Inter, system-ui, sans-serif;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .25;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: linear-gradient(to bottom, black, transparent 90%);
}
button,
input {
  font: inherit;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
.app {
  min-height: 100vh;
  display: flex;
}
.side {
  width: 335px;
  min-width: 335px;
  min-height: 100vh;
  position: sticky;
  top: 0;
  display: flex;
  flex-direction: column;
  padding: 26px 20px;
  background: rgba(7,7,9,.82);
  border-right: 1px solid var(--line);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 8px 34px;
  font-family: "Space Grotesk", sans-serif;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: -.8px;
}
.brand-logo {
  width: 43px;
  height: 43px;
  object-fit: cover;
  border-radius: 12px;
  box-shadow:
    0 0 0 1px rgba(255,106,26,.25),
    0 8px 35px rgba(255,106,26,.2);
}
.brand span {
  background: linear-gradient(135deg,#fff 30%,#ff9659);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.sidebar-section {
  margin-bottom: 24px;
}
.label {
  color: #85858d;
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 1.25px;
  margin: 0 4px 10px;
}
.input-row {
  display: flex;
  gap: 8px;
}
.input-row input {
  width: 100%;
  min-width: 0;
  height: 48px;
  padding: 0 15px;
  color: var(--text);
  background: rgba(255,255,255,.035);
  border: 1px solid var(--line2);
  border-radius: 13px;
  outline: none;
  transition: .25s ease;
}
.input-row input::placeholder {
  color: #5f5f67;
}
.input-row input:focus {
  background: rgba(255,255,255,.055);
  border-color: rgba(255,106,26,.55);
  box-shadow: 0 0 0 4px rgba(255,106,26,.08);
}
.input-row button {
  flex: 0 0 48px;
  height: 48px;
  border: 0;
  border-radius: 13px;
  color: #170b04;
  background: linear-gradient(135deg,var(--orange2),var(--orange));
  box-shadow: 0 10px 30px rgba(255,106,26,.2);
  font-size: 23px;
  font-weight: 700;
  cursor: pointer;
  transition: .2s ease;
}
.input-row button:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 35px rgba(255,106,26,.3);
}
.input-row button:active {
  transform: scale(.96);
}
.shops {
  display: flex;
  gap: 8px;
  margin-top: 11px;
}
.shops label {
  flex: 1;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: var(--muted);
  background: rgba(255,255,255,.025);
  border: 1px solid var(--line);
  border-radius: 11px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: .2s ease;
}
.shops label:hover {
  color: white;
  background: rgba(255,255,255,.05);
  border-color: var(--line2);
}
.shops input {
  accent-color: var(--orange);
}
.item-list {
  flex: 1;
  min-height: 80px;
  overflow-y: auto;
  padding-right: 3px;
  margin-bottom: 20px;
  scrollbar-width: thin;
  scrollbar-color: #29292f transparent;
}
.item-list::-webkit-scrollbar {
  width: 4px;
}
.item-list::-webkit-scrollbar-thumb {
  background: #29292f;
  border-radius: 20px;
}
.item-tag {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 48px;
  padding: 9px 11px 9px 14px;
  margin-bottom: 8px;
  background: linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
  border: 1px solid var(--line);
  border-radius: 13px;
  font-size: 13px;
  font-weight: 600;
  animation: slideIn .3s ease both;
}
.item-tag span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.remove {
  flex: 0 0 27px;
  width: 27px;
  height: 27px;
  border: 0;
  border-radius: 8px;
  color: #aaaab1;
  background: rgba(255,255,255,.045);
  font-size: 17px;
  cursor: pointer;
  transition: .2s ease;
}
.remove:hover {
  color: white;
  background: rgba(255,92,105,.16);
}
.empty-list {
  padding: 18px 5px;
  color: var(--muted2);
  font-size: 12px;
}
.search-btn {
  width: 100%;
  height: 52px;
  border: 0;
  border-radius: 14px;
  color: #160b05;
  background: linear-gradient(135deg,#ff9a5b,#ff6818);
  box-shadow:
    0 10px 32px rgba(255,106,26,.18),
    inset 0 1px rgba(255,255,255,.25);
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  transition: .22s ease;
}
.search-btn:hover {
  transform: translateY(-2px);
  box-shadow:
    0 16px 40px rgba(255,106,26,.28),
    inset 0 1px rgba(255,255,255,.25);
}
.search-btn:active {
  transform: scale(.985);
}
.main {
  flex: 1;
  min-width: 0;
  padding: 55px clamp(25px,5vw,76px) 70px;
}
.content {
  width: min(1050px,100%);
  margin: 0 auto;
}
.header {
  margin-bottom: 30px;
  animation: fadeUp .5s ease both;
}
.header h1 {
  margin-bottom: 11px;
  font-family: "Space Grotesk", sans-serif;
  font-size: clamp(32px,4vw,48px);
  line-height: 1.05;
  letter-spacing: -1.8px;
}
.header p {
  max-width: 650px;
  color: var(--muted);
  font-size: 15px;
}
.total-card {
  position: relative;
  overflow: hidden;
  padding: 24px;
  margin-bottom: 22px;
  background:
    radial-gradient(circle at 100% 0%,rgba(255,106,26,.1),transparent 34%),
    linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.018));
  border: 1px solid var(--line2);
  border-radius: 20px;
  box-shadow: 0 18px 55px rgba(0,0,0,.16);
  animation: fadeUp .5s ease both;
}
.total-card::before {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  right: -70px;
  top: -90px;
  background: var(--orange);
  opacity: .08;
  filter: blur(50px);
  border-radius: 50%;
}
.total-top {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 20px;
}
.total-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}
.total-label strong {
  display: block;
  color: var(--text);
  margin-top: 4px;
  font-size: 15px;
}
.total-price {
  color: var(--green);
  font-family: "Space Grotesk", sans-serif;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -1px;
}
.cheapest-links {
  position: relative;
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
  gap: 9px;
}
.cheap-link {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 12px 13px;
  color: var(--text);
  text-decoration: none;
  background: rgba(0,0,0,.17);
  border: 1px solid var(--line);
  border-radius: 13px;
  transition: .22s ease;
}
.cheap-link:hover {
  background: rgba(255,255,255,.045);
  border-color: rgba(255,106,26,.25);
  transform: translateY(-2px);
}
.cheap-link .left {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.cheap-link .term {
  color: var(--muted2);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .7px;
}
.cheap-link .name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 600;
}
.cheap-link .price {
  color: var(--green);
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
}
.results-grid {
  display: grid;
  gap: 15px;
}
.item-card {
  overflow: hidden;
  background: rgba(16,16,20,.76);
  border: 1px solid var(--line);
  border-radius: 19px;
  box-shadow: 0 12px 45px rgba(0,0,0,.12);
  backdrop-filter: blur(16px);
  animation: fadeUp .5s ease both;
  transition: .25s ease;
}
.item-card:hover {
  border-color: var(--line2);
  box-shadow: 0 18px 55px rgba(0,0,0,.18);
  transform: translateY(-2px);
}
.item-card-header {
  min-height: 57px;
  padding: 15px 19px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  background: rgba(255,255,255,.025);
  border-bottom: 1px solid var(--line);
}
.product-name {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 800;
}
.item-icon {
  width: 29px;
  height: 29px;
  display: grid;
  place-items: center;
  color: #ff9b61;
  background: rgba(255,106,26,.1);
  border: 1px solid rgba(255,106,26,.15);
  border-radius: 9px;
}
.from {
  color: var(--muted2);
  font-size: 11px;
  font-weight: 600;
}
.from b {
  color: var(--green);
  font-size: 13px;
}
.product {
  position: relative;
  padding: 17px 19px;
  border-bottom: 1px solid var(--line);
  transition: background .2s ease;
}
.product:last-child {
  border-bottom: 0;
}
.product:hover {
  background: rgba(255,255,255,.018);
}
.product.best {
  background:
    linear-gradient(90deg,rgba(53,215,120,.075),transparent 70%),
    rgba(53,215,120,.025);
}
.product.best::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: linear-gradient(to bottom,var(--green),rgba(53,215,120,.15));
}
.product-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}
.price {
  color: var(--green);
  font-family: "Space Grotesk", sans-serif;
  font-size: 20px;
  font-weight: 700;
}
.product:not(.best) .price {
  font-size: 15px;
}
.best-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 8px;
  color: var(--green);
  background: rgba(53,215,120,.08);
  border: 1px solid rgba(53,215,120,.13);
  border-radius: 999px;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .7px;
  text-transform: uppercase;
}
.title {
  margin: 6px 0 9px;
  color: #e9e9ec;
  font-size: 13.5px;
  line-height: 1.5;
}
.meta {
  display: flex;
  align-items: center;
  gap: 9px;
}
.store {
  display: inline-flex;
  align-items: center;
  min-height: 25px;
  padding: 3px 9px;
  color: #a9a9b0;
  background: rgba(255,255,255,.045);
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
}
.open {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
  color: #ff9457;
  text-decoration: none;
  font-size: 11px;
  font-weight: 700;
  transition: .2s ease;
}
.open:hover {
  color: #ffb17f;
  gap: 7px;
}
.empty {
  min-height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
  padding: 40px;
  color: var(--muted);
  text-align: center;
  background: rgba(255,255,255,.018);
  border: 1px solid var(--line);
  border-radius: 20px;
  animation: fadeUp .5s ease both;
}
.empty strong {
  color: #e8e8eb;
  font-size: 14px;
}
.empty span {
  color: var(--muted2);
  font-size: 12px;
}
.empty-icon {
  width: 50px;
  height: 50px;
  display: grid;
  place-items: center;
  margin-bottom: 3px;
  color: #ff914f;
  background: rgba(255,106,26,.08);
  border: 1px solid rgba(255,106,26,.12);
  border-radius: 15px;
  font-size: 22px;
}
.error-box {
  padding: 18px;
  margin-bottom: 18px;
  color: #ff9ca5;
  background: rgba(255,92,105,.07);
  border: 1px solid rgba(255,92,105,.16);
  border-radius: 15px;
  font-size: 13px;
  line-height: 1.5;
}
#loading {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 24px;
  background:
    radial-gradient(circle at center,rgba(255,106,26,.075),transparent 35%),
    rgba(5,5,7,.93);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
#loading.show {
  display: flex;
  animation: loadingIn .3s ease both;
}
.loading-logo-wrap {
  position: relative;
  width: 155px;
  height: 155px;
  display: grid;
  place-items: center;
}
.loading-logo-wrap::before,
.loading-logo-wrap::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255,106,26,.25);
  animation: pulseRing 2s ease-out infinite;
}
.loading-logo-wrap::before {
  inset: 13px;
}
.loading-logo-wrap::after {
  inset: -5px;
  animation-delay: .55s;
}
.loading-logo {
  position: relative;
  z-index: 2;
  width: 108px;
  height: 108px;
  object-fit: cover;
  border-radius: 29px;
  box-shadow:
    0 0 0 1px rgba(255,106,26,.3),
    0 0 60px rgba(255,106,26,.24);
  animation: logoFloat 2.3s ease-in-out infinite;
}
.loading-copy {
  text-align: center;
}
.loading-copy h2 {
  margin-bottom: 7px;
  font-family: "Space Grotesk",sans-serif;
  font-size: 22px;
}
.loading-copy p {
  color: var(--muted);
  font-size: 13px;
}
.loading-dots {
  display: flex;
  justify-content: center;
  gap: 5px;
  margin-top: 14px;
}
.loading-dots span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--orange);
  animation: dot 1.2s ease-in-out infinite;
}
.loading-dots span:nth-child(2) {
  animation-delay: .15s;
}
.loading-dots span:nth-child(3) {
  animation-delay: .3s;
}
.loading-bar {
  width: min(240px,65vw);
  height: 3px;
  overflow: hidden;
  background: rgba(255,255,255,.08);
  border-radius: 999px;
}
.loading-bar::before {
  content: "";
  display: block;
  width: 42%;
  height: 100%;
  background: linear-gradient(90deg,transparent,var(--orange),#ffb17e);
  animation: loadingBar 1.25s ease-in-out infinite;
}
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(-7px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}
@keyframes loadingIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes logoFloat {
  0%,100% {
    transform: translateY(0) scale(1);
  }
  50% {
    transform: translateY(-7px) scale(1.025);
  }
}
@keyframes pulseRing {
  0% {
    transform: scale(.75);
    opacity: .65;
  }
  100% {
    transform: scale(1.35);
    opacity: 0;
  }
}
@keyframes dot {
  0%,80%,100% {
    transform: scale(.65);
    opacity: .35;
  }
  40% {
    transform: scale(1);
    opacity: 1;
  }
}
@keyframes loadingBar {
  0% {
    transform: translateX(-150%);
  }
  100% {
    transform: translateX(350%);
  }
}
@media (max-width:900px) {
  .side {
    width: 290px;
    min-width: 290px;
  }
  .main {
    padding: 42px 28px 60px;
  }
}
@media (max-width:720px) {
  .app {
    display: block;
  }
  .side {
    width: 100%;
    min-width: 0;
    min-height: auto;
    position: relative;
    padding: 17px 16px 16px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    margin: 0 3px 17px;
    font-size: 21px;
  }
  .brand-logo {
    width: 38px;
    height: 38px;
  }
  .sidebar-section {
    margin-bottom: 15px;
  }
  .item-list {
    max-height: 180px;
    min-height: auto;
  }
  .main {
    padding: 34px 16px 45px;
  }
  .total-top {
    align-items: flex-start;
    flex-direction: column;
    gap: 7px;
  }
  .total-price {
    font-size: 29px;
  }
  .cheapest-links {
    grid-template-columns: 1fr;
  }
  .empty {
    min-height: 220px;
  }
}
@media (prefers-reduced-motion:reduce) {
  *,
  *::before,
  *::after {
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">
    <img
      class="brand-logo"
      src="https://iili.io/fuZmZP9.gif"
      alt="Flare"
    >
    <span>Flare</span>
  </div>
  <div class="sidebar-section">
    <div class="label">Item adder</div>
    <form id="addForm">
      <div class="input-row">
        <input
          type="text"
          id="addInput"
          placeholder="Search box here..."
          autocomplete="off"
          autofocus
        >
        <button type="submit" aria-label="Add item">
          +
        </button>
      </div>
      <div class="shops">
        <label>
          <input type="checkbox" id="amazonToggle" checked>
          Amazon
        </label>
        <label>
          <input type="checkbox" id="tescoToggle" checked>
          Tesco
        </label>
      </div>
    </form>
  </div>
  <div class="label">Added Items</div>
  <div class="item-list" id="itemList"></div>
  <button
    class="search-btn"
    id="searchButton"
    type="button"
    style="display:none;"
  >
    Search prices
  </button>
</aside>
<main class="main">
  <div id="loading">
    <div class="loading-logo-wrap">
      <img
        class="loading-logo"
        src="https://iili.io/fuZmZP9.gif"
        alt="FLARE"
      >
    </div>
    <div class="loading-copy">
      <h2>FLARE is searching</h2>
      <p>
        Finding the best prices across your selected stores
      </p>
      <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <div class="loading-bar"></div>
  </div>
  <div class="content">
    <div class="header">
      <h1>Flare deals.</h1>
      <p>
        Looking for cheap priced deals?
      </p>
    </div>
    <div id="errorArea"></div>
    <div id="contentArea">
      <div class="empty">
        <strong>Whoops... We're empty!</strong>
        <span>
          Add an item to start searching.
        </span>
      </div>
    </div>
  </div>
</main>
</div>
<script>
const FLARE_API =
  "https://d73b-2a00-23c8-3639-601-dd36-aa07-de7d-6164.ngrok-free.app";
const API_SEARCH_PATH = "/api/search";
const LOGO_URL =
  "https://iili.io/fuZmZP9.gif";
let items = [];
let lastResults = null;
const addForm =
  document.getElementById("addForm");
const addInput =
  document.getElementById("addInput");
const itemList =
  document.getElementById("itemList");
const searchButton =
  document.getElementById("searchButton");
const amazonToggle =
  document.getElementById("amazonToggle");
const tescoToggle =
  document.getElementById("tescoToggle");
const loading =
  document.getElementById("loading");
const contentArea =
  document.getElementById("contentArea");
const errorArea =
  document.getElementById("errorArea");
function escapeHTML(value) {
  const div =
    document.createElement("div");
  div.textContent =
    value ?? "";
  return div.innerHTML;
}
function formatPrice(value) {
  const number =
    Number(value);
  if (!Number.isFinite(number)) {
    return "£0.00";
  }
  return "£" +
    number.toFixed(2);
}
function saveItems() {
  localStorage.setItem(
    "flare_items",
    JSON.stringify(items)
  );
}
function loadItems() {
  try {
    const saved =
      JSON.parse(
        localStorage.getItem(
          "flare_items"
        ) || "[]"
      );
    if (Array.isArray(saved)) {
      items =
        saved.filter(
          item =>
            typeof item === "string" &&
            item.trim()
        );
    }
  } catch {
    items = [];
  }
}
function renderItems() {
  if (!items.length) {
    itemList.innerHTML = `
      <div class="empty-list">
        Add products to begin searching for deals.
      </div>
    `;
    searchButton.style.display =
      "none";
    return;
  }
  itemList.innerHTML = "";
  items.forEach(
    (item, index) => {
      const row =
        document.createElement("div");
      row.className =
        "item-tag";
      row.innerHTML = `
        <span>
          ${escapeHTML(item)}
        </span>
        <button
          class="remove"
          type="button"
          aria-label="Remove ${escapeHTML(item)}"
          title="Remove"
          data-index="${index}"
        >
          ×
        </button>
      `;
      row
        .querySelector(".remove")
        .addEventListener(
          "click",
          () => removeItem(index)
        );
      itemList.appendChild(row);
    }
  );
  searchButton.style.display =
    "block";
}
function addItem(value) {
  const item =
    value.trim();
  if (!item) {
    return;
  }
  const exists =
    items.some(
      existing =>
        existing.toLowerCase() ===
        item.toLowerCase()
    );
  if (exists) {
    addInput.value = "";
    return;
  }
  items.push(item);
  saveItems();
  renderItems();
  addInput.value = "";
  addInput.focus();
}
function removeItem(index) {
  items.splice(index, 1);
  saveItems();
  renderItems();
  if (!items.length) {
    lastResults = null;
    showEmptyState();
  }
}
function showLoading() {
  loading.classList.add("show");
  document.body.style.overflow =
    "hidden";
}
function hideLoading() {
  loading.classList.remove("show");
  document.body.style.overflow =
    "";
}
function showError(message) {
  errorArea.innerHTML = `
    <div class="error-box">
      ${escapeHTML(message)}
    </div>
  `;
}
function clearError() {
  errorArea.innerHTML = "";
}
function showEmptyState() {
  contentArea.innerHTML = `
    <div class="empty">
      <strong>
        Whoops... We're empty!
      </strong>
      <span>
        Add an item to start searching.
      </span>
    </div>
  `;
}
function showReadyState() {
  contentArea.innerHTML = `
    <div class="empty">
      <strong>
        Whoops... Nothing seems to be here
        add something new!
      </strong>
      <span>
        Add items and click search to look for deals.
      </span>
    </div>
  `;
}
function createCheapLink(term, data) {
  if (!data || !data.cheapest) {
    return "";
  }
  const product =
    data.cheapest;
  const title =
    String(product.title || "");
  return `
    <a
      class="cheap-link"
      href="${escapeHTML(product.url || "#")}"
      target="_blank"
      rel="noopener noreferrer"
    >
      <div class="left">
        <span class="term">
          ${escapeHTML(term)}
        </span>
        <span class="name">
          ${
            escapeHTML(
              title.length > 70
                ? title.slice(0, 70) + "…"
                : title
            )
          }
        </span>
      </div>
      <span class="price">
        ${formatPrice(product.price)}
      </span>
    </a>
  `;
}
function createProduct(product, best) {
  return `
    <div class="product ${best ? "best" : ""}">
      <div class="product-top">
        <div class="price">
          ${formatPrice(product.price)}
        </div>
        ${
          best
            ? `
              <span class="best-badge">
                Best price
              </span>
            `
            : ""
        }
      </div>
      <div class="title">
        ${escapeHTML(product.title || "Product")}
      </div>
      <div class="meta">
        <span class="store">
          ${escapeHTML(product.store || "Store")}
        </span>
        <a
          class="open"
          href="${escapeHTML(product.url || "#")}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${best ? "Open product →" : "Open →"}
        </a>
      </div>
    </div>
  `;
}
function createItemCard(term, data) {
  const cheapest =
    data && data.cheapest;
  const results =
    data &&
    Array.isArray(data.results)
      ? data.results
      : [];
  let productsHTML = "";
  if (cheapest) {
    productsHTML +=
      createProduct(
        cheapest,
        true
      );
    results
      .filter(
        product =>
          product &&
          product !== cheapest
      )
      .slice(0, 4)
      .forEach(
        product => {
          productsHTML +=
            createProduct(
              product,
              false
            );
        }
      );
  } else {
    productsHTML = `
      <div class="product">
        <div
          class="title"
          style="color:var(--muted);margin:0;"
        >
          No results found for this item.
        </div>
      </div>
    `;
  }
  return `
    <div class="item-card">
      <div class="item-card-header">
        <div class="product-name">
          <span class="item-icon">
            ✦
          </span>
          ${escapeHTML(term)}
        </div>
        ${
          cheapest
            ? `
              <span class="from">
                From
                <b>
                  ${formatPrice(cheapest.price)}
                </b>
              </span>
            `
            : ""
        }
      </div>
      ${productsHTML}
    </div>
  `;
}
function renderResults(data) {
  const results =
    data &&
    data.results &&
    typeof data.results === "object"
      ? data.results
      : {};
  let cheapestLinks = "";
  Object.keys(results)
    .forEach(term => {
      cheapestLinks +=
        createCheapLink(
          term,
          results[term]
        );
    });
  let cards = "";
  Object.keys(results)
    .forEach(term => {
      cards +=
        createItemCard(
          term,
          results[term]
        );
    });
  contentArea.innerHTML = `
    <div class="total-card">
      <div class="total-top">
        <div class="total-label">
          Estimated cheapest total
          <strong>
            Best available prices across your list
          </strong>
        </div>
        <div class="total-price">
          ${formatPrice(data.grand_total || 0)}
        </div>
      </div>
      ${
        cheapestLinks
          ? `
            <div class="cheapest-links">
              ${cheapestLinks}
            </div>
          `
          : ""
      }
    </div>
    <div class="results-grid">
      ${cards}
    </div>
  `;
}
async function searchPrices() {
  if (!items.length) {
    showEmptyState();
    return;
  }
  const amazon =
    amazonToggle.checked;
  const tesco =
    tescoToggle.checked;
  if (!amazon && !tesco) {
    showError(
      "Select at least one store."
    );
    return;
  }
  clearError();
  showLoading();
  try {
    const params =
      new URLSearchParams();
    items.forEach(item => {
      params.append(
        "item",
        item
      );
    });
    params.set(
      "amazon",
      amazon ? "1" : "0"
    );
    params.set(
      "tesco",
      tesco ? "1" : "0"
    );
    const apiUrl =
      `${FLARE_API}${API_SEARCH_PATH}?${params.toString()}`;
    console.log(
      "[FLARE] Request:",
      apiUrl
    );
    const response =
      await fetch(
        apiUrl,
        {
          method: "GET",
          headers: {
            "Accept": "application/json",
            "ngrok-skip-browser-warning": "true"
          },
          credentials: "omit"
        }
      );
    console.log(
      "[FLARE] HTTP status:",
      response.status
    );
    const contentType =
      response.headers.get(
        "content-type"
      ) || "";
    console.log(
      "[FLARE] Content-Type:",
      contentType
    );
    const raw =
      await response.text();
    console.log(
      "[FLARE] Raw response:",
      raw.slice(0, 500)
    );
    if (!response.ok) {
      throw new Error(
        `API returned HTTP ${response.status}. ` +
        `${raw.slice(0, 250)}`
      );
    }
    if (
      !contentType.includes(
        "application/json"
      )
    ) {
      const looksLikeHTML =
        raw.trim().startsWith("<!DOCTYPE") ||
        raw.trim().startsWith("<html") ||
        raw.includes("<html");
      if (looksLikeHTML) {
        throw new Error(
          "The API URL returned the Flare HTML page instead of JSON. " +
          "Your ngrok tunnel is pointing to the frontend instead of backend port 2034."
        );
      }
      throw new Error(
        "The FLARE API did not return JSON. " +
        `Content-Type: ${contentType || "unknown"}`
      );
    }
    let data;
    try {
      data =
        JSON.parse(raw);
    } catch {
      throw new Error(
        "FLARE returned invalid JSON."
      );
    }
    console.log(
      "[FLARE] Parsed response:",
      data
    );
    if (
      !data ||
      data.success !== true
    ) {
      throw new Error(
        data?.error ||
        "The FLARE API returned an unsuccessful response."
      );
    }
    lastResults =
      data;
    renderResults(data);
  } catch (error) {
    console.error(
      "[FLARE] SEARCH ERROR:",
      error
    );
    let message =
      error?.message ||
      "Unable to connect to FLARE.";
    if (
      message === "Failed to fetch" ||
      message.includes(
        "NetworkError"
      )
    ) {
      message =
        "Could not reach the FLARE backend. " +
        "Make sure the backend is running on port 2034, " +
        "ngrok is forwarding to port 2034, and CORS allows this frontend.";
    }
    showError(message);
    showReadyState();
  } finally {
    hideLoading();
  }
}
addForm.addEventListener(
  "submit",
  event => {
    event.preventDefault();
    addItem(
      addInput.value
    );
  }
);
addInput.addEventListener(
  "keydown",
  event => {
    if (
      event.key === "Enter"
    ) {
      event.preventDefault();
      addItem(
        addInput.value
      );
    }
  }
);
searchButton.addEventListener(
  "click",
  searchPrices
);
amazonToggle.addEventListener(
  "change",
  () => {
    if (lastResults) {
      lastResults = null;
      showReadyState();
    }
  }
);
tescoToggle.addEventListener(
  "change",
  () => {
    if (lastResults) {
      lastResults = null;
      showReadyState();
    }
  }
);
loadItems();
renderItems();
if (items.length) {
  showReadyState();
}
</script>
</body>
</html>
