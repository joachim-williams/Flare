<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flare AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #212121;
  --sidebar: #171717;
  --sidebar-hover: rgba(255,255,255,0.06);
  --surface: #2f2f2f;
  --border: rgba(255,255,255,0.1);
  --text: #ececec;
  --muted: #b4b4b4;
  --muted2: #8e8e8e;
  --accent: #ff8a00;
  --accent-soft: rgba(255,138,0,0.14);
  --green: #3dd68c;
  --composer-bg: #2f2f2f;
  --shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 4px 24px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  height: 100vh;
  color: var(--text);
  background: var(--bg);
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  display: flex;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; border: 0; background: none; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--sidebar);
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid rgba(255,255,255,0.06);
}
.sidebar-top {
  padding: 10px 10px 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.side-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 40px;
  padding: 0 12px;
  border-radius: 10px;
  color: var(--text);
  font-size: 13.5px;
  font-weight: 500;
  text-decoration: none;
  transition: background .12s;
  white-space: nowrap;
}
.side-btn:hover { background: var(--sidebar-hover); }
.side-btn img, .side-btn svg {
  width: 18px; height: 18px; flex-shrink: 0; object-fit: contain; opacity: 0.85;
}
.side-btn.new-chat {
  border: 1px solid var(--border);
  background: transparent;
}
.side-btn.new-chat:hover {
  background: var(--sidebar-hover);
  border-color: rgba(255,255,255,0.16);
}
.side-btn.back-deals {
  background: rgba(255,138,0,0.1);
  border: 1px solid rgba(255,138,0,0.22);
  color: #ffc46b;
}
.side-btn.back-deals:hover {
  background: rgba(255,138,0,0.18);
  border-color: rgba(255,138,0,0.35);
  color: #ffd08a;
}
.side-btn.back-deals img { opacity: 1; }

.sidebar-section-label {
  padding: 14px 14px 6px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted2);
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.chat-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px 12px;
}
.chat-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 9px 8px 9px 12px;
  border-radius: 10px;
  cursor: pointer;
  margin-bottom: 1px;
  transition: background .1s;
}
.chat-item:hover { background: var(--sidebar-hover); }
.chat-item.active { background: rgba(255,255,255,0.08); }
.chat-item-title {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 13.5px; font-weight: 400; color: var(--text);
}
.chat-item-menu-btn {
  flex: 0 0 28px; width: 28px; height: 28px; border-radius: 8px;
  color: var(--muted2); font-size: 15px; line-height: 1; opacity: 0;
  display: grid; place-items: center;
  transition: opacity .1s, background .1s, color .1s;
}
.chat-item:hover .chat-item-menu-btn,
.chat-item-menu-btn.open { opacity: 1; }
.chat-item-menu-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
.chat-menu {
  position: absolute; right: 8px; top: 38px; z-index: 50;
  min-width: 148px; background: #2a2a2a;
  border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
  box-shadow: var(--shadow); padding: 4px; display: none;
}
.chat-menu.open { display: block; }
.chat-menu button {
  width: 100%; text-align: left; padding: 9px 12px; border-radius: 8px;
  color: #f87171; font-size: 13px; font-weight: 500;
}
.chat-menu button:hover { background: rgba(239,68,68,0.12); }
.side-empty {
  padding: 28px 16px; text-align: center; color: var(--muted2);
  font-size: 13px; line-height: 1.45;
}
.sidebar-footer {
  padding: 10px; border-top: 1px solid rgba(255,255,255,0.06);
}
.user-row {
  display: none; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 10px; transition: background .12s;
}
.user-row.show { display: flex; }
.user-row:hover { background: var(--sidebar-hover); }
.user-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #ff6a00);
  color: #111; font-weight: 700; font-size: 12px;
  display: grid; place-items: center; flex-shrink: 0;
}
.user-meta { flex: 1; min-width: 0; }
.user-meta .name {
  font-size: 13px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.user-meta .plan { font-size: 11px; color: var(--muted2); }
.btn-logout-side {
  font-size: 11.5px; font-weight: 600; color: var(--muted2);
  padding: 4px 8px; border-radius: 6px;
}
.btn-logout-side:hover { color: var(--text); background: rgba(255,255,255,0.06); }

.main {
  flex: 1; display: flex; flex-direction: column;
  min-width: 0; min-height: 0; background: var(--bg); position: relative;
}
.topbar {
  height: 48px; flex-shrink: 0; display: flex; align-items: center;
  padding: 0 14px; gap: 10px;
}
.mobile-menu {
  display: none; width: 36px; height: 36px; border-radius: 8px;
  color: var(--muted); font-size: 18px; place-items: center;
}
.mobile-menu:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.topbar-title { font-size: 14px; font-weight: 600; color: var(--text); opacity: 0.9; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.auth-btns { display: flex; gap: 6px; }
.btn-login, .btn-signup {
  padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
}
.btn-login { color: var(--muted); }
.btn-login:hover { color: var(--text); background: rgba(255,255,255,0.06); }
.btn-signup {
  background: linear-gradient(135deg, var(--accent), #ff6a00); color: #111;
}
.btn-signup:hover { filter: brightness(1.06); }

.messages-wrap {
  flex: 1; overflow-y: auto; min-height: 0;
  display: flex; flex-direction: column; padding-bottom: 12px;
}
.messages {
  flex: 1; width: 100%; max-width: 768px; margin: 0 auto;
  padding: 12px 16px 48px; display: flex; flex-direction: column; gap: 18px;
}
.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; padding: 40px 20px 100px; gap: 16px;
}
.empty-icon { width: 56px; height: 56px; opacity: 0.9; }
.empty-icon img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; }
.empty-state h1 {
  font-size: 1.75rem; font-weight: 600; letter-spacing: -0.03em; color: var(--text);
}
.empty-state p { color: var(--muted); font-size: 14.5px; max-width: 360px; }

.msg { display: flex; gap: 14px; max-width: 100%; line-height: 1.6; }
.msg.user { flex-direction: row-reverse; justify-content: flex-start; }
.msg.user .msg-avatar { display: none; }
.msg.user .msg-content {
  flex: 0 1 auto; width: fit-content; max-width: 85%;
  background: #2f2f2f; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px; padding: 10px 14px;
}
.msg.user .msg-role { display: none; }
.msg-avatar {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 2px;
}
.msg.assistant .msg-avatar { background: #3a3a3a; overflow: hidden; }
.msg.assistant .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg-content { flex: 1; min-width: 0; }
.msg-role { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
.msg-role .agent-tag {
  display: inline-block; font-size: 11px; font-weight: 600;
  color: var(--accent); background: var(--accent-soft);
  padding: 2px 8px; border-radius: 6px; margin-left: 6px; letter-spacing: 0.02em;
}
.msg-body { font-size: 15px; color: var(--text); word-break: break-word; }
.msg-body p { margin: 0 0 10px; }
.msg-body p:last-child { margin-bottom: 0; }
.msg-body strong, .msg-body b { font-weight: 700; }
.msg-body em, .msg-body i { font-style: italic; }
.msg-body code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.88em; background: rgba(255,255,255,0.08);
  border-radius: 5px; padding: 1px 5px; color: #ffd29a;
}
.msg-body pre {
  margin: 12px 0; padding: 14px 16px; background: #1a1a1a;
  border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
  overflow-x: auto; position: relative;
}
.msg-body pre code {
  background: transparent; border: 0; padding: 0; color: #e8ecf4;
  font-size: 13px; line-height: 1.5; display: block; white-space: pre;
}
.msg-body a { color: var(--accent); text-decoration: none; font-weight: 500; }
.msg-body a:hover { text-decoration: underline; }
.msg-body ul, .msg-body ol { margin: 8px 0 10px 1.25em; }
.msg-body li { margin-bottom: 4px; }
.msg-body h1, .msg-body h2, .msg-body h3 {
  font-weight: 700; letter-spacing: -.02em; margin: 14px 0 8px;
}
.msg-body h1 { font-size: 1.3em; }
.msg-body h2 { font-size: 1.15em; }
.msg-body h3 { font-size: 1.05em; }
.msg-body blockquote {
  border-left: 3px solid var(--accent); margin: 10px 0;
  padding: 4px 0 4px 14px; color: var(--muted);
}
.msg-body hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
.copy-btn {
  position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 600;
  padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.06); color: var(--muted); cursor: pointer;
}
.copy-btn:hover { color: var(--text); background: rgba(255,138,0,0.15); border-color: rgba(255,138,0,0.3); }

.think-wrap { margin-bottom: 8px; }
.think-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: rgba(255,255,255,0.04); color: var(--muted2);
  font-size: 11px; font-weight: 600; letter-spacing: .03em;
  text-transform: uppercase; cursor: pointer;
  transition: color .12s, border-color .12s, background .12s;
}
.think-btn:hover { color: var(--muted); border-color: rgba(255,255,255,0.14); }
.think-btn.open { color: var(--accent); border-color: rgba(255,138,0,0.3); background: var(--accent-soft); }
.think-panel {
  display: none; margin-top: 8px; padding: 10px 12px; border-radius: 10px;
  background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.06);
  color: var(--muted); font-size: 12.5px; line-height: 1.5;
  white-space: pre-wrap; max-height: 220px; overflow-y: auto;
}
.think-panel.open { display: block; }

.phase-banner {
  font-size: 13px; font-weight: 600; color: var(--accent);
  margin: 4px 0 10px; letter-spacing: -0.01em;
}
.agent-ball-row {
  display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start;
  margin: 10px 0 14px; min-height: 64px;
}
.agent-ball-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 4px; max-width: 88px;
}
.ball-status {
  font-size: 10px; line-height: 1.25; color: var(--muted);
  text-align: center; min-height: 2.4em; max-width: 88px;
}
.agent-ball {
  width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #111;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.12), 0 4px 14px rgba(0,0,0,0.35);
  position: relative; transition: transform .2s, box-shadow .2s;
}
.agent-ball:not(.live) { opacity: 0.45; filter: grayscale(0.25); }
.agent-ball.live {
  transform: scale(1.12);
  box-shadow: 0 0 0 3px rgba(255,255,255,0.2), 0 0 18px currentColor;
  animation: ball-bounce 1s ease-in-out infinite;
}
.agent-ball .ball-tip {
  position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: #2a2a2a; border: 1px solid rgba(255,255,255,0.12); color: var(--text);
  font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 6px;
  white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s;
}
.agent-ball:hover .ball-tip, .agent-ball.live .ball-tip { opacity: 1; }
@keyframes ball-bounce {
  0%, 100% { transform: scale(1.12) translateY(0); }
  50% { transform: scale(1.12) translateY(-4px); }
}
.agent-card {
  border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
  background: rgba(0,0,0,0.2); overflow: hidden; margin-bottom: 8px;
}
.agent-card-header {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.06);
  font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; user-select: none;
}
.agent-card-header .dot {
  width: 14px; height: 14px; border-radius: 50%; background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.08), 0 0 12px currentColor; flex-shrink: 0;
}
.agent-card-header.done .dot { animation: none; opacity: 0.95; }
.agent-card-header .name { color: var(--text); }
.agent-card-header .chev { margin-left: auto; opacity: 0.5; transition: transform .15s; }
.agent-card-header.open .chev { transform: rotate(90deg); }
.agent-card-body {
  padding: 10px 12px; font-size: 13px; color: var(--muted);
  max-height: 180px; overflow-y: auto; white-space: pre-wrap; display: none;
}
.agent-card-body.open { display: block; }
.agent-think {
  padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.05);
  display: none;
}
.agent-think-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .04em; color: var(--muted2); margin-bottom: 4px;
}
.agent-think-body {
  font-size: 12px; color: var(--muted); white-space: pre-wrap; max-height: 120px; overflow-y: auto;
}
.typing-dots-inline {
  display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle;
}
.typing-dots-inline i {
  width: 4px; height: 4px; border-radius: 50%; background: currentColor;
  animation: bounce 1.1s ease-in-out infinite; display: block;
}
.typing-dots-inline i:nth-child(2) { animation-delay: .15s; }
.typing-dots-inline i:nth-child(3) { animation-delay: .3s; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

.cursor {
  display: inline-block; width: 2px; height: 1em; background: var(--accent);
  margin-left: 2px; vertical-align: text-bottom; animation: blink .8s step-end infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
.typing {
  display: none; align-items: center; gap: 5px;
  padding: 4px 0 4px 16px; max-width: 768px; margin: 0 auto; width: 100%;
}
.typing.show { display: flex; }
.typing span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  animation: bounce 1.2s ease-in-out infinite;
}
.typing span:nth-child(2) { animation-delay: .15s; }
.typing span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce {
  0%, 80%, 100% { opacity: .3; transform: translateY(0); }
  40% { opacity: 1; transform: translateY(-4px); }
}

.composer-outer {
  flex-shrink: 0; padding: 16px 16px 16px;
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.composer-inner { max-width: 768px; margin: 0 auto; }
.composer-box {
  background: var(--composer-bg);
  border-radius: 28px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 0 0 0.5px rgba(255,255,255,0.04), 0 8px 32px rgba(0,0,0,0.35);
  overflow: visible;          
  transition: border-color .15s, box-shadow .15s;
  position: relative;
  z-index: 20;
}
.composer-box:focus-within {
  border-color: rgba(255,138,0,0.35);
  box-shadow: 0 0 0 2px rgba(255,138,0,0.08), 0 8px 32px rgba(0,0,0,0.35);
}
.composer-input { padding: 14px 18px 4px; }
#chatInput {
  width: 100%; min-height: 24px; max-height: 200px; resize: none;
  border: 0; outline: none; background: transparent; color: var(--text);
  font-size: 15.5px; line-height: 1.45; padding: 0;
}
#chatInput::placeholder { color: var(--muted2); }
.composer-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 4px 10px 10px;
}
.bar-left, .bar-right { display: flex; align-items: center; gap: 2px; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center;
  color: var(--muted); transition: background .12s, color .12s;
}
.icon-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
.icon-btn svg { width: 18px; height: 18px; }

.model-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 10px 0 8px;
  border-radius: 999px;
  color: var(--text);
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
  transition: background .12s;
  cursor: pointer;
  user-select: none;
  position: relative;
  z-index: 30;
}
.model-pill:hover { background: rgba(255,255,255,0.06); }
.model-pill .m-icon { display: inline-flex; color: var(--muted); }
.model-pill .m-icon svg { width: 16px; height: 16px; }
.model-pill .m-name { font-weight: 600; color: var(--text); }
.model-pill .m-tier { color: var(--muted2); font-weight: 500; }
.model-pill .m-chev { color: var(--muted2); display: inline-flex; margin-left: 1px; }
.model-pill .m-chev svg { width: 14px; height: 14px; }

.model-menu {
  position: absolute;
  bottom: calc(100% + 10px);   
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  min-width: 220px;
  background: #2a2a2a;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06);
  padding: 6px;
  display: none;
}
.model-menu.open {
  display: block;
}
.model-menu button {
  width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px;
  color: var(--text); font-size: 13px; font-weight: 500;
  display: flex; flex-direction: column; gap: 2px;
}
.model-menu button:hover { background: rgba(255,255,255,0.06); }
.model-menu button.active { background: var(--accent-soft); }
.model-menu button .mm-name { font-weight: 600; }
.model-menu button .mm-desc { font-size: 11px; color: var(--muted2); font-weight: 400; }

#sendBtn {
  width: 34px; height: 34px; border-radius: 999px; background: #fff; color: #0d0d0d;
  display: grid; place-items: center; transition: opacity .12s, background .12s; flex-shrink: 0;
}
#sendBtn:hover:not(:disabled) { background: #ececec; }
#sendBtn:disabled { opacity: 0.35; cursor: not-allowed; }
#sendBtn svg { width: 16px; height: 16px; }
.composer-hint {
  text-align: center; margin-top: 10px; font-size: 11.5px; color: var(--muted2);
}

.gate {
  position: fixed; inset: 0; z-index: 500; background: var(--bg);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; text-align: center; padding: 40px 20px;
}
.gate.show { display: flex; }
.gate h2 { font-size: 22px; font-weight: 700; }
.gate p { color: var(--muted); max-width: 360px; font-size: 14.5px; }
.gate .auth-btns { margin-top: 8px; }
.modal-overlay {
  position: fixed; inset: 0; z-index: 2000; display: none;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.72); backdrop-filter: blur(6px);
}
.modal-overlay.show { display: flex; }
.modal {
  width: min(400px, 94vw); background: #2a2a2a;
  border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
  padding: 28px 24px; box-shadow: var(--shadow);
}
.modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.modal p.sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
.modal label { display: block; font-size: 12px; font-weight: 600; color: var(--muted2); margin-bottom: 6px; }
.modal input {
  width: 100%; height: 42px; padding: 0 12px; margin-bottom: 14px;
  background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
  color: var(--text); outline: none;
}
.modal input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,138,0,.1); }
.modal .error { color: #fca5a5; font-size: 13px; margin-bottom: 12px; display: none; }
.modal .error.show { display: block; }
.modal .actions { display: flex; gap: 10px; margin-top: 8px; }
.modal .actions button {
  flex: 1; height: 42px; border-radius: 10px; font-weight: 600; cursor: pointer;
}
.modal .primary {
  background: linear-gradient(135deg, var(--accent), #ff6a00); color: #111;
}
.modal .secondary {
  background: rgba(255,255,255,0.06); color: var(--text);
  border: 1px solid rgba(255,255,255,0.1);
}
.modal .switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
.modal .switch a { color: var(--accent); cursor: pointer; font-weight: 600; }

<script>
const FLARE_API = window.FLARE_API || (location.hostname === "localhost" || location.hostname === "127.0.0.1"
  ? "http://127.0.0.1:2034"
  : "https://d73b-2a00-23c8-3639-601-dd36-aa07-de7d-6164.ngrok-free.app");

let currentUser = null;
let currentChatId = null;
let chatHistory = [];
let chats = [];
let isSending = false;
let userScrolledUp = false;
let openMenuId = null;
let pendingVerifyEmail = "";
let currentModel = localStorage.getItem("flare_model") || "flare"; 

function getToken() { return localStorage.getItem("flare_token") || ""; }
function setAuth(token, user) {
  localStorage.setItem("flare_token", token);
  currentUser = user;
  document.getElementById("authBtns").style.display = "none";
  document.getElementById("userChip").classList.add("show");
  document.getElementById("userNameDisplay").textContent = user.username || "User";
  document.getElementById("userAvatar").textContent = (user.username || "F").charAt(0).toUpperCase();
  loadChats();
}
function clearAuth() {
  localStorage.removeItem("flare_token");
  currentUser = null;
  currentChatId = null;
  chatHistory = [];
  chats = [];
  document.getElementById("authBtns").style.display = "flex";
  document.getElementById("userChip").classList.remove("show");
  renderEmptyMessages();
  document.getElementById("chatList").innerHTML = '<div class="side-empty">Log in to see chats.</div>';
}
function authHeaders(extra = {}) {
  return Object.assign({
    "Authorization": `Bearer ${getToken()}`,
    "Accept": "application/json",
    "ngrok-skip-browser-warning": "true"
  }, extra);
}
async function fetchJson(url, opts = {}) {
  const r = await fetch(url, opts);
  const ct = r.headers.get("content-type") || "";
  if (!ct.includes("application/json")) {
    const t = await r.text();
    throw new Error(t.slice(0, 200) || `HTTP ${r.status}`);
  }
  const data = await r.json();
  if (!r.ok && !data.success) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}
async function checkSession() {
  const token = getToken();
  if (!token) { clearAuth(); return; }
  try {
    const data = await fetchJson(`${FLARE_API}/api/auth/me`, { method: "GET", headers: authHeaders() });
    if (data.success && data.user) setAuth(token, data.user);
    else clearAuth();
  } catch { clearAuth(); }
}

function updateModelUI() {
  const name = document.getElementById("modelName");
  const tier = document.getElementById("modelTier");
  const menu = document.getElementById("modelMenu");
  if (currentModel === "flare-multi") {
    name.textContent = "Flare Multi";
    tier.textContent = "Agents";
  } else {
    name.textContent = "Flare";
    tier.textContent = "Fast";
  }
  menu.querySelectorAll("button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.model === currentModel);
  });
}
updateModelUI();

document.getElementById("modelPill").addEventListener("click", (e) => {
  e.stopPropagation();
  document.getElementById("modelMenu").classList.toggle("open");
});
document.getElementById("modelMenu").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-model]");
  if (!btn) return;
  e.stopPropagation();
  currentModel = btn.dataset.model;
  localStorage.setItem("flare_model", currentModel);
  updateModelUI();
  document.getElementById("modelMenu").classList.remove("open");
});
document.addEventListener("click", () => {
  document.getElementById("modelMenu").classList.remove("open");
});

function escapeHTML(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function firstSentence(text) {
  const t = String(text ?? "").replace(/\s+/g, " ").trim();
  if (!t) return "";
  const m = t.match(/^(.+?[.!?])(?:\s|$)/);
  if (m) return m[1].trim();
  return t.length > 140 ? t.slice(0, 137) + "…" : t;
}
function splitThinking(raw) {
  let text = String(raw ?? "");
  let thinking = "";
  const patterns = [
    /Thinking\.\.\.\s*([\s\S]*?)\s*\.\.\.done thinking\.\s*/i,
    /<think>\s*([\s\S]*?)\s*<\/think>\s*/i,
    /\[thinking\]\s*([\s\S]*?)\s*\[\/thinking\]\s*/i
  ];
  for (const re of patterns) {
    const m = text.match(re);
    if (m) {
      thinking = (m[1] || "").trim();
      text = text.replace(re, "").trim();
      break;
    }
  }
  if (!thinking) {
    const m2 = text.match(/^Thinking\.\.\.\s*([\s\S]*?)(?:\n{2,}|\r\n{2,})([\s\S]*)$/i);
    if (m2) {
      thinking = (m2[1] || "").replace(/\.\.\.done thinking\./i, "").trim();
      text = (m2[2] || "").trim();
    }
  }
  return { thinking, answer: text.trim() };
}
function renderMarkdown(src) {
  let text = String(src ?? "");
  const blocks = [];
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const id = blocks.length;
    blocks.push(`<pre><button class="copy-btn" type="button">Copy</button><code class="language-${escapeHTML(lang || "")}">${escapeHTML(code.replace(/\n$/, ""))}</code></pre>`);
    return `\0BLOCK${id}\0`;
  });
  text = text.replace(/`([^`\n]+)`/g, (_, c) => `<code>${escapeHTML(c)}</code>`);
  text = text.replace(/^######\s+(.+)$/gm, "<h3>$1</h3>");
  text = text.replace(/^#####\s+(.+)$/gm, "<h3>$1</h3>");
  text = text.replace(/^####\s+(.+)$/gm, "<h3>$1</h3>");
  text = text.replace(/^###\s+(.+)$/gm, "<h3>$1</h3>");
  text = text.replace(/^##\s+(.+)$/gm, "<h2>$1</h2>");
  text = text.replace(/^#\s+(.+)$/gm, "<h1>$1</h1>");
  text = text.replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>");
  text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/__(.+?)__/g, "<strong>$1</strong>");
  text = text.replace(/\*(.+?)\*/g, "<em>$1</em>");
  text = text.replace(/_(.+?)_/g, "<em>$1</em>");
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  text = text.replace(/^>\s+(.+)$/gm, "<blockquote>$1</blockquote>");
  text = text.replace(/^---+$/gm, "<hr>");
  text = text.replace(/^\s*[-*]\s+(.+)$/gm, "<li>$1</li>");
  text = text.replace(/(?:<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
  text = text.replace(/^\s*\d+\.\s+(.+)$/gm, "<li>$1</li>");
  text = text.replace(/\n{2,}/g, "</p><p>");
  text = text.replace(/\n/g, "<br>");
  text = `<p>${text}</p>`;
  text = text.replace(/<p>\s*<\/p>/g, "");
  text = text.replace(/<p>\s*(<h[123]>)/g, "$1");
  text = text.replace(/(<\/h[123]>)\s*<\/p>/g, "$1");
  text = text.replace(/<p>\s*(<ul>)/g, "$1");
  text = text.replace(/(<\/ul>)\s*<\/p>/g, "$1");
  text = text.replace(/<p>\s*(<pre>)/g, "$1");
  text = text.replace(/(<\/pre>)\s*<\/p>/g, "$1");
  text = text.replace(/<p>\s*(<blockquote>)/g, "$1");
  text = text.replace(/(<\/blockquote>)\s*<\/p>/g, "$1");
  text = text.replace(/<p>\s*(<hr>)\s*<\/p>/g, "$1");
  text = text.replace(/\0BLOCK(\d+)\0/g, (_, i) => blocks[Number(i)]);
  return text;
}
function bindCopyButtons(root) {
  root.querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const pre = btn.closest("pre");
      const code = pre ? pre.querySelector("code") : null;
      if (!code) return;
      navigator.clipboard.writeText(code.textContent || "").then(() => {
        btn.textContent = "Copied";
        setTimeout(() => { btn.textContent = "Copy"; }, 1500);
      }).catch(() => {});
    });
  });
}

function titleFromMessages(messages) {
  const first = messages.find(m => m.role === "user");
  if (!first) return "New chat";
  const t = String(first.content || "").replace(/\s+/g, " ").trim();
  return t.slice(0, 48) + (t.length > 48 ? "…" : "") || "New chat";
}
function renderChatList() {
  const list = document.getElementById("chatList");
  list.innerHTML = "";
  if (!chats.length) {
    list.innerHTML = '<div class="side-empty">No chats yet.<br>Start a conversation.</div>';
    return;
  }
  chats.forEach(chat => {
    const item = document.createElement("div");
    item.className = "chat-item" + (chat.id === currentChatId ? " active" : "");
    item.dataset.id = String(chat.id);
    item.innerHTML = `<span class="chat-item-title">${escapeHTML(chat.title || "New chat")}</span><button type="button" class="chat-item-menu-btn" aria-label="Menu">⋯</button><div class="chat-menu"><button type="button" class="delete-chat-btn">Delete chat</button></div>`;
    const menuBtn = item.querySelector(".chat-item-menu-btn");
    const menu = item.querySelector(".chat-menu");
    const delBtn = item.querySelector(".delete-chat-btn");
    item.addEventListener("click", e => {
      if (e.target.closest(".chat-item-menu-btn") || e.target.closest(".chat-menu")) return;
      openChat(chat.id);
      document.getElementById("chatSide").classList.remove("open");
    });
    menuBtn.addEventListener("click", e => {
      e.stopPropagation();
      const willOpen = !menu.classList.contains("open");
      document.querySelectorAll(".chat-menu.open").forEach(m => m.classList.remove("open"));
      document.querySelectorAll(".chat-item-menu-btn.open").forEach(b => b.classList.remove("open"));
      if (willOpen) {
        menu.classList.add("open");
        menuBtn.classList.add("open");
        openMenuId = chat.id;
      } else openMenuId = null;
    });
    delBtn.addEventListener("click", e => {
      e.stopPropagation();
      deleteChat(chat.id);
    });
    list.appendChild(item);
  });
}
document.addEventListener("click", () => {
  document.querySelectorAll(".chat-menu.open").forEach(m => m.classList.remove("open"));
  document.querySelectorAll(".chat-item-menu-btn.open").forEach(b => b.classList.remove("open"));
  openMenuId = null;
});

async function loadChats() {
  if (!getToken()) return;
  try {
    const data = await fetchJson(`${FLARE_API}/api/chats`, { method: "GET", headers: authHeaders() });
    chats = data.chats || [];
    renderChatList();
    if (currentChatId) {
      const exists = chats.some(c => c.id === currentChatId);
      if (exists) await openChat(currentChatId);
      else await startNewChat(true);
    } else if (chats.length) {
      await openChat(chats[0].id);
    } else {
      await startNewChat(true);
    }
  } catch (e) {
    console.error(e);
    renderEmptyMessages();
  }
}

function scrollMessagesToBottom(force = false) {
  const wrap = document.getElementById("messagesWrap");
  if (force || !userScrolledUp) wrap.scrollTop = wrap.scrollHeight;
}

function renderEmptyMessages() {
  const messages = document.getElementById("messages");
  messages.innerHTML = `
    <div class="empty-state">
      <div class="empty-icon"><img src="https://iili.io/fuZmZP9.gif" alt=""></div>
      <h1>Need help with something?</h1>
      <p>Ask about deals, ideas, or anything else. Pick a model, and gain free acsess to one of our most advanced agents.</p>
    </div>`;
  chatHistory = [];
}
function renderHistoryMessages() {
  const messages = document.getElementById("messages");
  messages.innerHTML = "";
  if (!chatHistory.length) {
    renderEmptyMessages();
    return;
  }
  chatHistory.forEach(m => {
    if (m.role === "user") appendUserMessage(m.content, false);
    else appendAssistantStatic(m.content);
  });
  scrollMessagesToBottom(true);
}
function appendUserMessage(content, scroll = true) {
  const messages = document.getElementById("messages");
  const empty = messages.querySelector(".empty-state");
  if (empty) empty.remove();
  const div = document.createElement("div");
  div.className = "msg user";
  const initial = (currentUser?.username || "Y").charAt(0).toUpperCase();
  div.innerHTML = `<div class="msg-avatar">${initial}</div><div class="msg-content"><div class="msg-role">You</div><div class="msg-body"><p>${escapeHTML(content).replace(/\n/g, "<br>")}</p></div></div>`;
  messages.appendChild(div);
  if (scroll) scrollMessagesToBottom(true);
}
function appendAssistantStatic(content) {
  const messages = document.getElementById("messages");
  const empty = messages.querySelector(".empty-state");
  if (empty) empty.remove();
  const div = document.createElement("div");
  div.className = "msg assistant";
  const { thinking, answer } = splitThinking(content);
  let thinkHtml = "";
  if (thinking) {
    thinkHtml = `<div class="think-wrap"><button type="button" class="think-btn">View thinking</button><div class="think-panel">${escapeHTML(firstSentence(thinking))}</div></div>`;
  }
  div.innerHTML = `<div class="msg-avatar"><img src="https://iili.io/fuZmZP9.gif" alt=""></div><div class="msg-content"><div class="msg-role">Flare</div>${thinkHtml}<div class="msg-body">${renderMarkdown(answer || content)}</div></div>`;
  const thinkBtn = div.querySelector(".think-btn");
  const thinkPanel = div.querySelector(".think-panel");
  if (thinkBtn && thinkPanel) {
    thinkBtn.addEventListener("click", () => {
      const open = thinkPanel.classList.toggle("open");
      thinkBtn.classList.toggle("open", open);
      thinkBtn.textContent = open ? "Hide thinking" : "View thinking";
    });
  }
  bindCopyButtons(div);

function typeAnswer(shell, answer, onDone) {
  const full = String(answer || "");
  let i = 0;
  const chunk = 14;
  const delay = 3;
  const step = () => {
    i = Math.min(i + chunk, full.length);
    const slice = full.slice(0, i);
    shell.body.innerHTML = renderMarkdown(slice) + (i < full.length ? '<span class="cursor"></span>' : "");
    bindCopyButtons(shell.body);
    scrollMessagesToBottom();
    if (i < full.length) {
      requestAnimationFrame(() => setTimeout(step, delay));
    } else {
      shell.body.innerHTML = renderMarkdown(full);
      bindCopyButtons(shell.body);
      if (onDone) onDone();
    }
  };
  step();
}

const PHASES = {
  "Brain": "Making prompt better…",
  "Brain (Final)": "Finalizing answer…",
  "Triage": "Routing specialists…",
  "Researcher": "Gathering facts…",
  "Analyst": "Structuring the problem…",
  "Creative": "Exploring better ideas…",
  "Specialist": "Applying domain expertise…",
  "Critic": "Stress-testing claims…",
  "Debate/Verifier": "Resolving contradictions…",
  "Writer": "Writing the answer…",
  "Quality Control": "Polishing output…"
};
function agentColor(name) {
  const map = {
    "Brain": "#ff8a00", "Brain (Final)": "#ff8a00", "Triage": "#60a5fa",
    "Researcher": "#34d399", "Analyst": "#a78bfa", "Creative": "#f472b6",
    "Specialist": "#22d3ee", "Critic": "#f87171", "Debate/Verifier": "#fbbf24",
    "Writer": "#4ade80", "Quality Control": "#c084fc", "System": "#94a3b8"
  };
  if (map[name]) return map[name];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return `hsl(${Math.abs(h) % 360} 70% 55%)`;
}
function agentInitial(name) {
  const parts = String(name).split(/[\s/()]+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return String(name).slice(0, 2).toUpperCase();
}

function ensureBall(shell, agentName) {
  if (shell.balls[agentName]) return shell.balls[agentName];
  const color = agentColor(agentName);
  const wrap = document.createElement("div");
  wrap.className = "agent-ball-wrap";
  wrap.style.opacity = "0";
  wrap.style.transform = "scale(0.6)";
  wrap.style.transition = "opacity .35s ease, transform .35s ease";
  const ball = document.createElement("div");
  ball.className = "agent-ball";
  ball.style.background = color;
  ball.innerHTML = `${escapeHTML(agentInitial(agentName))}<span class="ball-tip">${escapeHTML(agentName)}</span>`;
  const status = document.createElement("div");
  status.className = "ball-status";
  wrap.appendChild(ball);
  wrap.appendChild(status);
  shell.ballRow.appendChild(wrap);
  requestAnimationFrame(() => {
    wrap.style.opacity = "1";
    wrap.style.transform = "scale(1)";
  });
  shell.balls[agentName] = ball;
  shell.ballWraps[agentName] = wrap;
  shell.ballStatuses[agentName] = status;
  scrollMessagesToBottom();
  return ball;
}
function setBallStatus(shell, agentName, text) {
  ensureBall(shell, agentName);
  const st = shell.ballStatuses[agentName];
  if (st) st.textContent = text || "";
  shell.liveTag.style.display = "inline-block";
  shell.liveTag.textContent = text ? `${agentName} · ${text}` : agentName;
  shell.liveTag.style.color = agentColor(agentName);
}
function ensureAgentCard(shell, agentName) {
  if (shell.agentCards[agentName]) return shell.agentCards[agentName];
  const color = agentColor(agentName);
  const card = document.createElement("div");
  card.className = "agent-card";
  card.innerHTML = `
    <div class="agent-card-header">
      <span class="dot" style="background:${color};color:${color}"></span>
      <span class="name">${escapeHTML(agentName)}</span>
      <span class="typing-dots-inline" style="color:${color};display:none"><i></i><i></i><i></i></span>
      <span class="chev">›</span>
    </div>

      <div class="agent-think-label">Thinking</div>
      <div class="agent-think-body"></div>
    </div>
    <div class="agent-card-body"></div>`;
  const header = card.querySelector(".agent-card-header");
  const body = card.querySelector(".agent-card-body");
  const dots = card.querySelector(".typing-dots-inline");
  const thinkWrap = card.querySelector(".agent-think");

    if (thinkWrap.dataset.hasThink === "1") {
      thinkWrap.style.display = open ? "block" : "none";
    }
  });
  shell.agentsContainer.appendChild(card);
  shell.agentCards[agentName] = { card, header, body, dots, color, thinkWrap, thinkBody };
  scrollMessagesToBottom();
  return shell.agentCards[agentName];
}
function setAgentRunning(shell, agentName, label) {
  const c = ensureAgentCard(shell, agentName);
  const ball = ensureBall(shell, agentName);
  c.header.classList.remove("done");
  if (c.dots) c.dots.style.display = "inline-flex";
  Object.values(shell.balls).forEach(b => b.classList.remove("live"));
  ball.classList.add("live");
  const phase = PHASES[agentName] || (label ? String(label) : `${agentName} working…`);
  const banner = shell.el.querySelector("#phaseBanner");
  if (banner) banner.textContent = phase;
  shell.liveTag.style.display = "inline-block";
  shell.liveTag.textContent = label ? `${agentName} · ${label}` : agentName;
  shell.liveTag.style.color = c.color;
}
function setAgentThinking(shell, agentName, thinking) {
  const c = ensureAgentCard(shell, agentName);
  ensureBall(shell, agentName);
  if (!thinking) return;
  c._pendingThink = (c._pendingThink ? c._pendingThink + "\n" : "") + thinking;
  c.thinkWrap.dataset.hasThink = "1";
}
function setAgentDone(shell, agentName, content) {
  const c = ensureAgentCard(shell, agentName);
  const ball = ensureBall(shell, agentName);
  c.header.classList.add("done");
  if (c.dots) c.dots.style.display = "none";
  ball.classList.remove("live");
  let think = c._pendingThink || "";
  if (!think && content && content.length > 20 && !content.startsWith("✓")) {
    think = content;
  }
  if (think) {
    c.thinkWrap.dataset.hasThink = "1";
    c.thinkWrap.style.display = "block";
    c.thinkBody.textContent = firstSentence(think);
    c.body.classList.add("open");
    c.header.classList.add("open");
  } else if (content) {
    c.body.textContent = content;
    c.body.classList.add("open");
    c.header.classList.add("open");
  }
  c._pendingThink = "";
}
function typeFinalMulti(shell, answer, onDone) {
  const full = String(answer || "");
  let i = 0;
  const chunk = Math.max(48, Math.floor(full.length / 20));
  const step = () => {
    i = Math.min(i + chunk, full.length);
    const slice = full.slice(0, i);
    shell.finalBody.innerHTML = renderMarkdown(slice) + (i < full.length ? '<span class="cursor"></span>' : "");
    bindCopyButtons(shell.finalBody);
    scrollMessagesToBottom();
    if (i < full.length) {
      requestAnimationFrame(() => setTimeout(step, 6));
    } else {
      shell.finalBody.innerHTML = renderMarkdown(full);
      bindCopyButtons(shell.finalBody);
      Object.values(shell.balls || {}).forEach(b => b.classList.remove("live"));
      shell.liveTag.style.display = "none";
      const banner = shell.el.querySelector("#phaseBanner");
      if (banner) banner.textContent = "Complete";
      if (onDone) onDone();
    }
  };
  step();
}

async function streamNormal(messages, onToken, onDone, onError) {
  const token = getToken();
  try {
    const response = await fetch(`${FLARE_API}/api/ai`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "text/event-stream, application/json",
        "Authorization": `Bearer ${token}`,
        "ngrok-skip-browser-warning": "true"
      },
      body: JSON.stringify({ messages, stream: true, model: "flare" })
    });
    const ct = response.headers.get("content-type") || "";
    if (ct.includes("application/json")) {
      const data = await response.json();
      if (!response.ok || data.error) throw new Error(data.error || `HTTP ${response.status}`);
      const reply = data.reply || data.message || data.content || "";
      onToken(reply);
      onDone(reply);
      return;
    }
    if (!response.ok) {
      const t = await response.text();
      throw new Error(t.slice(0, 200) || `HTTP ${response.status}`);
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let full = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n");
      buffer = parts.pop() || "";
      for (const line of parts) {
        const trimmed = line.trim();
        if (!trimmed.startsWith("data:")) continue;
        const payload = trimmed.slice(5).trim();
        if (!payload || payload === "[DONE]") continue;
        let obj;
        try { obj = JSON.parse(payload); } catch { continue; }
        if (obj.error) throw new Error(obj.error);
        if (obj.token) {
          full += obj.token;
          onToken(full);
        }
        if (obj.done) {
          onDone(full);
          return;
        }
      }
    }
    onDone(full);
  } catch (e) {
    onError(e);
  }
}

async function streamMulti(message, shell, onDone, onError) {
  const token = getToken();
  try {
    const response = await fetch(`${FLARE_API}/api/ai/multi`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "text/event-stream",
        "Authorization": `Bearer ${token}`,
        "ngrok-skip-browser-warning": "true"
      },
      body: JSON.stringify({ message, stream: true })
    });
    if (!response.ok) {
      const t = await response.text();
      throw new Error(t.slice(0, 200) || `HTTP ${response.status}`);
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let finalContent = "";
    let finalReceived = false;
    let answerStarted = false;
    const startedAgents = new Set();
    const doneAgents = new Set();

    const allBallsDone = () =>
      startedAgents.size > 0 && [...startedAgents].every(a => doneAgents.has(a));

    const tryStartAnswer = () => {
      if (answerStarted) return;
      if (!finalReceived) {
        // Balls finished first — show waiting for answer until final arrives
        if (allBallsDone()) {
          const banner = shell.el.querySelector("#phaseBanner");
          if (banner) banner.textContent = "Composing answer…";
          Object.values(shell.balls || {}).forEach(b => b.classList.remove("live"));
          shell.liveTag.style.display = "none";
        }
        return;
      }
      // Final is ready — only type after every ball has completed
      if (!allBallsDone() && startedAgents.size > 0) {
        const banner = shell.el.querySelector("#phaseBanner");
        if (banner) banner.textContent = "Finishing agents…";
        return;
      }
      answerStarted = true;
      Object.values(shell.balls || {}).forEach(b => b.classList.remove("live"));
      shell.liveTag.style.display = "none";
      const banner = shell.el.querySelector("#phaseBanner");
      if (banner) banner.textContent = "Writing answer…";
      typeFinalMulti(shell, finalContent, () => onDone(finalContent));
    };

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n");
      buffer = parts.pop() || "";
      for (const line of parts) {
        const trimmed = line.trim();
        if (!trimmed.startsWith("data:")) continue;
        const payload = trimmed.slice(5).trim();
        if (!payload || payload === "[DONE]") continue;
        let obj;
        try { obj = JSON.parse(payload); } catch { continue; }

        document.getElementById("typing").classList.remove("show");

        if (obj.type === "agent_start") {
          startedAgents.add(obj.agent);
          setAgentRunning(shell, obj.agent, obj.content || "Starting…");
        } else if (obj.type === "agent_status") {
          startedAgents.add(obj.agent);
          setBallStatus(shell, obj.agent, obj.content || "");
          setAgentRunning(shell, obj.agent, obj.content || "");
        } else if (obj.type === "agent_thinking") {
          startedAgents.add(obj.agent);
          setAgentThinking(shell, obj.agent, obj.content || "");
        } else if (obj.type === "agent_token") {
          startedAgents.add(obj.agent);
          if (obj.content) setAgentThinking(shell, obj.agent, obj.content);
        } else if (obj.type === "agent_done") {
          startedAgents.add(obj.agent);
          doneAgents.add(obj.agent);
          setAgentDone(shell, obj.agent, obj.content || "");
          const doneLabel = (obj.content || "").startsWith("✓")
            ? obj.content
            : "Done";
          setBallStatus(shell, obj.agent, doneLabel);
          tryStartAnswer();
        } else if (obj.type === "final") {
          finalContent = obj.content || "";
          finalReceived = true;
          tryStartAnswer();
        } else if (obj.type === "error") {
          shell.finalBody.innerHTML = renderMarkdown(`**Error:** ${obj.content || "Unknown error"}`);
          onError(new Error(obj.content || "Unknown error"));
        }
      }
    }
    if (!answerStarted) {
      if (finalReceived) {
        answerStarted = true;
        typeFinalMulti(shell, finalContent, () => onDone(finalContent));
      } else {
        onDone("");
      }
    }
  } catch (e) {
    onError(e);
  }
}

async function saveCurrentChat() {
  if (!getToken() || !currentChatId) return;
  const title = titleFromMessages(chatHistory);
  try {
    await fetchJson(`${FLARE_API}/api/chats/${currentChatId}`, {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ title, messages: chatHistory })
    });
    const c = chats.find(x => x.id === currentChatId);
    if (c) { c.title = title; c.updated_at = new Date().toISOString(); }
    chats.sort((a, b) => String(b.updated_at || "").localeCompare(String(a.updated_at || "")));
    renderChatList();
  } catch (e) { console.error("[FLARE] save chat failed", e); }
}
async function startNewChat(silent) {
  if (!getToken()) return;
  try {
    const data = await fetchJson(`${FLARE_API}/api/chats`, {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ title: "New chat", messages: [] })
    });
    const chat = data.chat;
    chats.unshift({ id: chat.id, title: chat.title, created_at: chat.created_at, updated_at: chat.updated_at });
    currentChatId = chat.id;
    chatHistory = [];
    renderChatList();
    renderEmptyMessages();
    if (!silent) document.getElementById("chatInput").focus();
  } catch (e) {
    console.error(e);
    currentChatId = null;
    chatHistory = [];
    renderEmptyMessages();
  }
}
async function openChat(id) {
  if (!getToken()) return;
  try {
    const data = await fetchJson(`${FLARE_API}/api/chats/${id}`, { method: "GET", headers: authHeaders() });
    const chat = data.chat;
    currentChatId = chat.id;
    chatHistory = Array.isArray(chat.messages) ? chat.messages : [];
    renderChatList();
    renderHistoryMessages();
  } catch (e) { console.error(e); }
}
async function deleteChat(id) {
  if (!getToken()) return;
  try {
    await fetchJson(`${FLARE_API}/api/chats/${id}`, {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ action: "delete" })
    });
    chats = chats.filter(c => c.id !== id);
    if (currentChatId === id) {
      currentChatId = null;
      if (chats.length) await openChat(chats[0].id);
      else await startNewChat(true);
    } else renderChatList();
  } catch (e) { console.error(e); }
}

async function sendMessage() {
  if (isSending) return;
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  if (!getToken()) { openLoginModal(); return; }
  if (!currentChatId) await startNewChat(true);

  isSending = true;
  document.getElementById("sendBtn").disabled = true;
  input.value = "";
  input.style.height = "auto";
  appendUserMessage(text);
  chatHistory.push({ role: "user", content: text });
  await saveCurrentChat();
  document.getElementById("typing").classList.add("show");
  scrollMessagesToBottom(true);

  if (currentModel === "flare-multi") {
    const shell = createMultiShell();
    await streamMulti(
      text,
      shell,
      (finalText) => {
        document.getElementById("typing").classList.remove("show");
        const answer = finalText || "Sorry, I couldn't generate a response.";
        chatHistory.push({ role: "assistant", content: answer });
        saveCurrentChat();
        isSending = false;
        document.getElementById("sendBtn").disabled = false;
        input.focus();
      },
      (e) => {
        document.getElementById("typing").classList.remove("show");
        shell.finalBody.innerHTML = renderMarkdown(`**Error:** ${e.message || "Could not reach Flare Multi."}`);
        isSending = false;
        document.getElementById("sendBtn").disabled = false;
        input.focus();
      }
    );
  } else {
    const shell = createAssistantShell();
    let lastRaw = "";
    let finished = false;
    let streamedAny = false;
    const finish = (raw) => {
      if (finished) return;
      finished = true;
      document.getElementById("typing").classList.remove("show");
      const { thinking, answer } = splitThinking(raw || lastRaw);
      setThinking(shell, thinking);
      const finalText = answer || "Sorry, I couldn't generate a response.";
      chatHistory.push({ role: "assistant", content: finalText });
      saveCurrentChat();
      const unlock = () => {
        isSending = false;
        document.getElementById("sendBtn").disabled = false;
        input.focus();
      };
      if (streamedAny) {
        shell.body.innerHTML = renderMarkdown(finalText);
        bindCopyButtons(shell.body);
        scrollMessagesToBottom();
        unlock();
      } else {
        typeAnswer(shell, finalText, unlock);
      }
    };
    await streamNormal(
      chatHistory.slice(0, -1).concat([{ role: "user", content: text }]),
      (partial) => {
        lastRaw = partial;
        document.getElementById("typing").classList.remove("show");
        const { thinking, answer } = splitThinking(partial);
        setThinking(shell, thinking);
        if (answer) {
          streamedAny = true;
          shell.body.innerHTML = renderMarkdown(answer) + '<span class="cursor"></span>';
          bindCopyButtons(shell.body);
          scrollMessagesToBottom();
        }
      },
      (full) => finish(full),
      (e) => {
        document.getElementById("typing").classList.remove("show");
        shell.body.innerHTML = renderMarkdown(`**Error:** ${e.message || "Could not reach Flare AI."}`);
        isSending = false;
        document.getElementById("sendBtn").disabled = false;
        input.focus();
      }
    );
  }
}

    if (data.needs_verification) { openVerify(data.email); return; }
    if (data.needs_2fa) { openVerify(data.email); return; }
    if (!data.success) throw new Error(data.error || "Login failed");
    setAuth(data.token, data.user);
    closeModals();
  } catch (e) {
    err.textContent = e.message;
    err.classList.add("show");
  }
});

document.getElementById("signupSubmit").addEventListener("click", async () => {
  const err = document.getElementById("signupError");
  err.classList.remove("show");
  const username = document.getElementById("signupUsername").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;
  try {
    const data = await fetchJson(`${FLARE_API}/api/auth/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json", "ngrok-skip-browser-warning": "true" },
      body: JSON.stringify({ username, email, password })
    });
    if (data.needs_verification) { openVerify(data.email || email); return; }
    if (!data.success) throw new Error(data.error || "Signup failed");
    setAuth(data.token, data.user);
    closeModals();
  } catch (e) {
    err.textContent = e.message;
    err.classList.add("show");
  }
});

const verifyCodeInput = document.getElementById("verifyCodeInput");
verifyCodeInput.addEventListener("input", () => {
  verifyCodeInput.value = verifyCodeInput.value.replace(/\D/g, "").slice(0, 6);
});
verifyCodeInput.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); document.getElementById("verifySubmit").click(); }
});
document.getElementById("verifySubmit").addEventListener("click", async () => {
  const err = document.getElementById("verifyError");
  err.classList.remove("show");
  const code = verifyCodeInput.value.trim();
  if (!/^\d{6}$/.test(code)) {
    err.textContent = "Enter the 6-digit code from your email.";
    err.style.color = "#fca5a5";
    err.classList.add("show");
    verifyCodeInput.focus();
    return;
  }
  try {
    const data = await fetchJson(`${FLARE_API}/api/auth/verify-code`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json", "ngrok-skip-browser-warning": "true" },
      body: JSON.stringify({ email: pendingVerifyEmail, code })
    });
    if (!data.success) throw new Error(data.error || "Verification failed");
    setAuth(data.token, data.user);
    document.getElementById("verifyModal").classList.remove("show");
  } catch (e) {
    err.textContent = e.message;
    err.classList.add("show");
  }
});
document.getElementById("resendCodeBtn").addEventListener("click", async () => {
  const err = document.getElementById("verifyError");
  err.classList.remove("show");
  try {
    const data = await fetchJson(`${FLARE_API}/api/auth/resend-code`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json", "ngrok-skip-browser-warning": "true" },
      body: JSON.stringify({ email: pendingVerifyEmail })
    });
    if (!data.success) throw new Error(data.error || "Could not resend");
    err.textContent = "New code sent — check your inbox.";
    err.style.color = "#22c55e";
    err.classList.add("show");
    verifyCodeInput.value = "";
    verifyCodeInput.focus();
  } catch (e) {
    err.style.color = "#fca5a5";
    err.textContent = e.message;
    err.classList.add("show");
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  const token = getToken();
  if (token) {
    try {
      await fetch(`${FLARE_API}/api/auth/logout`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}`, "ngrok-skip-browser-warning": "true" }
      });
    } catch {}
  }
  clearAuth();
});

checkSession();
</script>
</body>
</html>
